<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenDevs - Eco-Mercado</title>
    <!-- Tailwind CSS CDN para que se vea lindo rápido -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-emerald-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">🍏 GreenDevs</h1>
            <span class="text-sm bg-emerald-700 px-3 py-1 rounded-full">Mercado Directo</span>
        </div>
    </nav>

    <!-- Buscador / Filtros -->
    <div class="container mx-auto my-6 p-4">
        <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
            <h2 class="text-xl font-semibold text-emerald-800">Productos Disponibles</h2>
            <div class="w-full md:w-1/3 flex gap-2">
                <input type="text" id="input-region" placeholder="Filtrar por región..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="cargarProductos()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition">Buscar</button>
            </div>
        </div>
    </div>

    <!-- Catálogo de Tarjetas -->
    <main class="container mx-auto px-4 pb-12">
        <div id="contenedor-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScript meterá las tarjetas aquí dinámicamente -->
            <div class="text-center col-span-full py-12 text-gray-500">Cargando cosechas del día...</div>
        </div>
    </main>

    <!-- JavaScript para conectar con Django -->
    <script>
        const API_URL = 'http://127.0.0.1:8000/api/productos/'; // Ajusta la URL de tu server Django

        async function cargarProductos() {
            const region = document.getElementById('input-region').value;
            const contenedor = document.getElementById('contenedor-productos');
            
            try {
                // Si hay filtro de región, lo añadimos a la url
                const url = region ? `${API_URL}?region=${region}` : API_URL;
                const response = await fetch(url);
                const productos = await response.json();
                
                contenedor.innerHTML = ''; // Limpiar cargando
                
                if(productos.length === 0) {
                    contenedor.innerHTML = `<div class="text-center col-span-full py-12 text-gray-500">No hay cosechas disponibles en esta región por ahora.</div>`;
                    return;
                }

                productos.forEach(prod => {
                    // Creamos la tarjeta dinámicamente con estilos Tailwind lindos
                    const card = `
                        <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-gray-100 overflow-hidden transition duration-300 flex flex-col justify-between">
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-gray-900">${prod.nombre}</h3>
                                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${prod.categoria === 'CITRICO' ? 'bg-orange-100 text-orange-800' : 'bg-green-100 text-green-800'}">
                                        ${prod.categoria}
                                    </span>
                                </div>
                                <p class="text-sm text-gray-500 mb-4">📍 Finca: <span class="font-medium text-gray-700">${prod.finca}</span> (${prod.region})</p>
                                <div class="flex items-baseline gap-1 mb-1">
                                    <span class="text-2xl font-extrabold text-emerald-600">C$${prod.precio}</span>
                                    <span class="text-sm text-gray-500">/ por ${prod.unidad}</span>
                                </div>
                                <p class="text-xs text-gray-600">Disponibilidad inmediata: <span class="font-bold">${prod.disponible} ${prod.unidad}s</span></p>
                            </div>
                            <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                                <span class="text-xs text-gray-500">Por: ${prod.productor}</span>
                                <button class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Cotizar Pedido</button>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });

            } catch (error) {
                console.error("Error cargando la API:", error);
                contenedor.innerHTML = `<div class="text-center col-span-full py-12 text-red-500">Error al conectar con el servidor backend.</div>`;
            }
        }

        // Carga inicial al abrir la página
        window.onload = cargarProductos;
    </script>
</body>
</html>
